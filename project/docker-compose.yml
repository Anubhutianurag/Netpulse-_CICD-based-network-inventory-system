services:
  app:
    build: .
    restart: always
    volumes:
      - student_data:/data
  nginx:
    image: docker.io/library/nginx:alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      - app
volumes:
  student_data:
